services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-private-key.pem
    volumes:
      - /home/abhi/abhicodeagent.2026-07-26.private-key.pem:/run/secrets/github-app-private-key.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:
