apiVersion: v1
kind: ServiceAccount
metadata:
  name: coding-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coding-agent-sandbox-manager
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coding-agent-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: coding-agent
roleRef:
  kind: Role
  name: coding-agent-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent
  labels:
    app: coding-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-agent
  template:
    metadata:
      labels:
        app: coding-agent
    spec:
      serviceAccountName: coding-agent
      containers:
        - name: coding-agent
          image: codingagent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PATH_PREFIX
              value: "/coding-agent"
            # i know this is bad and i should read thsi from sec but it's got only 5 dol don't freak out
            - name: OPENAI_API_KEY
              value: "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"
            - name: AUTH0_DOMAIN
              value: "dev-xd0ga8sh216d7yr0.us.auth0.com"
            - name: AUTH0_AUDIENCE
              value: "https://fastapibackend"
            - name: MONGO_DB_URI
              value: "mongodb://mongodb:27017"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: SANDBOX_EXPIRY_TIME_SEC
              value: "600"
            - name: SANDBOX_IMAGE
              value: "sandbox"
            - name: LANGFUSE_HOST
              value: "http://my-langfuse-web.langfuse.svc.cluster.local:3000"
            - name: LANGFUSE_PUBLIC_KEY
              value: "pk-lf-464190e2-a90f-4c1e-a396-df68c554b539"
            - name: LANGFUSE_SECRET_KEY
              value: "sk-lf-dfa8b10f-8a76-496b-aad1-e8ac9ba53ab6"
---
apiVersion: v1
kind: Service
metadata:
  name: coding-agent
spec:
  type: LoadBalancer
  selector:
    app: coding-agent
  ports:
    - port: 80
      targetPort: 8000
